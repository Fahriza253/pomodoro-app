name: pomodoro_app
description: Offline-first Pomodoro timer app — MVP.
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  drift: ^2.32.1
  drift_flutter: ^0.3.1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.1
  wakelock_plus: ^1.3.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  audioplayers: ^6.5.0
  flutter_timezone: ^5.1.0
  live_activities: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.32.1
  test: ^1.25.14
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audios/
    - assets/icon/icon.png
