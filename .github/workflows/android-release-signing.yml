name: Android Release Signing Workflow

on:
  # push:
  #   branches:
  #   - main
  #   - release/*
  #
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Restore Gradle cache
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      # 1. Update CHANGELOGS (Placeholder - replace with actual command)
      # This step is highly project-specific. You might use a custom script
      # or a dedicated GitHub Action for managing your CHANGELOG.
      - name: Update Changelog (Placeholder)
        run: echo "Skipping CHANGELOG update for now. Implement your changelog update logic here."

      # 2. Run 'test' (Placeholder - replace with actual command)
      - name: Run Tests (Placeholder)
        run: ./gradlew test

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > app/my-upload-key.keystore

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sed -i '/\[\/code\]/d' app/build.gradle # Remove the placeholder line if it exists
          sed -i 's/storeFile file("my-upload-key.keystore")/storeFile file("my-upload-key.keystore")/' app/build.gradle
          sed -i 's/storePassword "your-keystore-password"/storePassword System.getenv("KEYSTORE_PASSWORD")/' app/build.gradle
          sed -i 's/keyAlias "my-key-alias"/keyAlias System.getenv("KEY_ALIAS")/' app/build.gradle
          sed -i 's/keyPassword "your-key-password"/keyPassword System.getenv("KEY_PASSWORD")/' app/build.gradle
          ./gradlew bundleRelease

      # 4. Create a new release based on tags
      - name: Get current version from build.gradle (example)
        id: get_version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' app/build.gradle | head -1)
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -1)
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') # Only create release if a tag is pushed
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          name: Release ${{ steps.get_version.outputs.version_name }}
          tag_name: ${{ github.ref }}
          body: |
            # Release ${{ steps.get_version.outputs.version_name }}

            Build Code: ${{ steps.get_version.outputs.version_code }}

            See CHANGELOG for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
