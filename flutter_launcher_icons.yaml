# Generate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "launcher_icon"
  image_path_android: "assets/icon/icon.png"
  min_sdk_android: 21
  # Adaptive (API 26+): solid matches outer ring in assets/icon/icon.xml
  adaptive_icon_background: "#4338CA"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_foreground_inset: 16

  # Android-only for this pass; regenerate iOS separately if needed.
  ios: false
